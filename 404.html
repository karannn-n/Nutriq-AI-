<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      GitHub Pages 404 → SPA redirect trick.
      When GH Pages gets a 404 (e.g. user refreshes /app/dashboard),
      this page encodes the URL into a query string and redirects to index.html,
      which then decodes it and restores the correct React Router path.

      Copy this file to: /public/404.html
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
